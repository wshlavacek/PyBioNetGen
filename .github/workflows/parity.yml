# BNGsim-vs-subprocess parity suite.
#
# STATUS: gated stub. The heavy parity run needs the pinned bngsim wheel, which
# is not yet on public PyPI (it ships from a private wheelhouse). Until bngsim
# is publicly installable, the full-suite job no-ops gracefully unless a wheel
# is provided via the BNGSIM_WHEEL_URL repo secret. The lightweight manifest
# integrity checks already run on every PR through the normal ci-testing
# workflow (tests/test_parity_suite.py::test_manifest_*), so per-PR coverage of
# the corpus catalog exists today; this workflow adds the on-demand / nightly
# full numerical run once bngsim is fetchable.
#
# When bngsim is public: drop the gate step, add `pip install bngsim==<pin>`,
# and (optionally) add a fast-tier job to the PR trigger.

name: parity-suite

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Corpus tier to run (fast | slow | glacial | original | all)"
        default: "fast"
        type: string
  schedule:
    - cron: "0 7 * * *"   # nightly 07:00 UTC (full suite)

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyBioNetGen
        run: |
          sudo apt-get update && sudo apt-get -y install libncurses-dev
          python -m pip install -e .

      # Gate: bngsim is private today. If a wheel URL secret is configured,
      # install it; otherwise mark the run gated and fall back to integrity-only.
      - name: Install pinned bngsim (if available)
        id: bngsim
        env:
          BNGSIM_WHEEL_URL: ${{ secrets.BNGSIM_WHEEL_URL }}
        run: |
          if [ -n "$BNGSIM_WHEEL_URL" ]; then
            python -m pip install "$BNGSIM_WHEEL_URL"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "bngsim wheel not configured (BNGSIM_WHEEL_URL secret unset) — gated."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manifest integrity (always)
        run: python -m pytest tests/test_parity_suite.py -k manifest_ -q

      - name: Full parity run (gated on bngsim)
        if: ${{ steps.bngsim.outputs.available == 'true' }}
        run: |
          TIER="${{ github.event.inputs.tier || 'all' }}"
          python scripts/parity_validate.py --tier "$TIER" --strict-version \
            --out parity_out --workers 4

      - name: Upload report
        if: ${{ steps.bngsim.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: |
            parity_out/parity_report.md
            parity_out/parity_report.json
